[project]
name = "vireyabot"
version = "0.1.0"
description = "VireyaBot administration and configuration platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "anthropic>=0.69,<1",
  "asyncpg>=0.29,<1",
  "cryptography>=42,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "openai>=1.109,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
  "websockets>=13,<16",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
